name: Menten AI
description: >-
  Menten AI is a biotechnology company pioneering generative AI for peptide
  drug design. Its MAUD 1.0 platform designs peptide macrocycles de novo for
  complex, previously undruggable targets by combining generative AI with
  physics-based models and quantum simulations, reporting nanomolar potency,
  oral bioavailability, cell permeability, and a greater-than-90% hit rate. The
  company operates through enterprise partnerships with pharmaceutical
  organizations rather than a public developer platform, and at the time of this
  profile publishes no public API, SDK, or developer documentation. Surfaced as
  a portfolio company of Uncork Capital and added to the API Evangelist network.
